<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Subjects</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 18px 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .back-btn {
            background: white;
            color: #1e3a8a;
            border: 1px solid #1e3a8a;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #1e3a8a;
            color: white;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        h2 {
            color: #1e3a8a;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1e3a8a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .add-btn {
            margin-top: 20px;
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #172554;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f8fafc;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>

    <div class="header">

        <h1>Subjects</h1>

    </div>


    <div class="container">

        <button
            type="button"
            class="back-btn"
            onclick="window.location.href='admin-dashboard.html'">

            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard

        </button>


        <!-- ================= ADD SUBJECT ================= -->

        <div class="card">

            <h2>Add New Subject</h2>

            <form id="subjectForm">

                <div class="form-grid">

                    <div>

                        <label for="subjectName">
                            Subject Name
                        </label>

                        <input
                            type="text"
                            id="subjectName"
                            placeholder="Enter subject name"
                            required
                        >

                    </div>


                    <div>

                        <label for="subjectCode">
                            Subject Code
                        </label>

                        <input
                            type="text"
                            id="subjectCode"
                            placeholder="Example: BSC-JAVA-101"
                            required
                        >

                    </div>


                    <div>

                        <label for="semester">
                            Semester
                        </label>

                        <select
                            id="semester"
                            required
                        >

                            <option value="">
                                Select Semester
                            </option>

                            <option value="1">
                                Semester 1
                            </option>

                            <option value="2">
                                Semester 2
                            </option>

                            <option value="3">
                                Semester 3
                            </option>

                            <option value="4">
                                Semester 4
                            </option>

                            <option value="5">
                                Semester 5
                            </option>

                            <option value="6">
                                Semester 6
                            </option>

                        </select>

                    </div>


                    <div>

                        <label for="facultyId">
                            Faculty ID
                        </label>

                        <input
                            type="number"
                            id="facultyId"
                            placeholder="Enter faculty ID"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="add-btn">

                    <i class="fa-solid fa-circle-plus" aria-hidden="true"></i> Add Subject

                </button>


                <div
                    id="message"
                    class="message">
                </div>

            </form>

        </div>


        <!-- ================= SUBJECT LIST ================= -->

        <div class="card">

            <h2>Available Subjects</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Subject ID</th>

                            <th>Subject Name</th>

                            <th>Subject Code</th>

                            <th>Semester</th>

                            <th>Faculty ID</th>

                        </tr>

                    </thead>


                    <tbody id="subjectTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="js/auth.js"></script>

    <script src="js/subjects.js"></script>

</body>

</html>
