<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - NIIT Smart Student Companion</title>


    <link rel="stylesheet" href="css/style.css">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #1e3a8a,
                    #2563eb
                );

        }


        /* ============================= */
        /* LOGIN CONTAINER */
        /* ============================= */

        .login-container {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.2);

        }


        /* ============================= */
        /* TITLE */
        /* ============================= */

        .login-container h1 {

            text-align: center;

            color: #1e3a8a;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #666;

            font-size: 14px;

            margin-bottom: 30px;

        }


        /* ============================= */
        /* FORM GROUP */
        /* ============================= */

        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;

        }


        /* ============================= */
        /* INPUT */
        /* ============================= */

        .form-group input {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;

        }


        .form-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.1);

        }


        /* ============================= */
        /* LOGIN BUTTON */
        /* ============================= */

        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #1e3a8a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        .login-button:hover {

            background: #172554;

        }


        .login-button:active {

            transform: scale(0.98);

        }


        /* ============================= */
        /* REGISTER LINK */
        /* ============================= */

        .register-section {

            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #666;

        }


        .register-section a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;

        }


        .register-section a:hover {

            text-decoration: underline;

        }


        /* ============================= */
        /* RESPONSIVE */
        /* ============================= */

        @media (max-width: 480px) {

            .login-container {

                width: 90%;

                padding: 30px 25px;

            }

        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>


    <!-- ============================= -->
    <!-- LOGIN CONTAINER -->
    <!-- ============================= -->

    <div class="login-container">

        <h1>NIIT Smart Student Companion</h1>

        <p class="subtitle">
            Login to your account
        </p>


        <!-- ============================= -->
        <!-- LOGIN FORM -->
        <!-- ============================= -->

        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <!-- ============================= -->
        <!-- REGISTER -->
        <!-- ============================= -->

        <div class="register-section">

            Don't have an account<i class="fa-solid fa-gear" aria-hidden="true"></i>

            <a href="student-registration.html">
                Register here
            </a>

        </div>

    </div>


    <!-- ============================= -->
    <!-- LOGIN JAVASCRIPT -->
    <!-- ============================= -->

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>


</body>

</html>
