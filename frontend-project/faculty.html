<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Faculty</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #1e3a8a;
            color: white;

            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 24px;
        }

        .back-button {
            background: white;
            color: #1e3a8a;

            border: none;
            padding: 10px 18px;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;
        }

        .back-button:hover {
            background: #e5e7eb;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 92%;
            max-width: 1200px;

            margin: 30px auto;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            background: white;

            padding: 25px;

            margin-bottom: 25px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #1e3a8a;

            margin-bottom: 20px;
        }

        /* =========================
           FORM
        ========================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;

            margin-bottom: 6px;

            color: #444;
        }

        .form-group input {
            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 2px rgba(37,99,235,0.1);
        }

        /* =========================
           BUTTONS
        ========================= */

        .button-group {
            margin-top: 20px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .btn {
            border: none;

            padding: 11px 20px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;
        }

        .add-btn {
            background: #1e3a8a;
            color: white;
        }

        .add-btn:hover {
            background: #172554;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;

            display: none;
        }

        .cancel-btn:hover {
            background: #4b5563;
        }

        /* =========================
           TABLE
        ========================= */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 900px;
        }

        th {
            background: #1e3a8a;

            color: white;

            padding: 13px;

            text-align: center;
        }

        td {
            padding: 12px;

            border-bottom: 1px solid #ddd;

            text-align: center;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        /* =========================
           ACTION BUTTONS
        ========================= */

        .edit-btn {
            background: #2563eb;

            color: white;

            border: none;

            padding: 7px 13px;

            border-radius: 5px;

            cursor: pointer;

            margin-right: 5px;
        }

        .edit-btn:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            background: #dc2626;

            color: white;

            border: none;

            padding: 7px 13px;

            border-radius: 5px;

            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        /* =========================
           MESSAGES
        ========================= */

        #message {
            margin-bottom: 15px;

            padding: 12px;

            border-radius: 6px;

            display: none;

            font-weight: bold;
        }

        .success-message {
            display: block !important;

            background: #dcfce7;

            color: #166534;
        }

        .error-message {
            display: block !important;

            background: #fee2e2;

            color: #991b1b;
        }

        .loading {
            text-align: center;

            padding: 20px;

            color: #666;
        }

        .no-data {
            text-align: center;

            padding: 20px;

            color: #666;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                flex-direction: column;

                gap: 15px;

                text-align: center;
            }

            .container {
                width: 95%;
            }

            .card {
                padding: 18px;
            }

        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>


<header>

    <h1><i class="fa-solid fa-chalkboard-user" aria-hidden="true"></i> Manage Faculty</h1>

    <button
        type="button"
        class="back-button"
        onclick="goBack()">

        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Admin Dashboard

    </button>

</header>


<div class="container">


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- FACULTY FORM -->

    <div class="card">

        <h2>Faculty Information</h2>


        <form id="facultyForm">


            <!-- Hidden ID -->

            <input
                type="hidden"
                id="facultyId">


            <div class="form-grid">


                <!-- Full Name -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter faculty name"
                        required>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter faculty email"
                        autocomplete="email"
                        required>

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter phone number"
                        autocomplete="tel"
                        required>

                </div>


                <!-- Department -->

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="Enter department"
                        required>

                </div>


                <!-- Designation -->

                <div class="form-group">

                    <label for="designation">
                        Designation
                    </label>

                    <input
                        type="text"
                        id="designation"
                        placeholder="Enter designation"
                        required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="new-password"
                        required>

                </div>

            </div>


            <div class="button-group">

                <button
                    type="submit"
                    id="submitButton"
                    class="btn add-btn">

                    Add Faculty

                </button>


                <button
                    type="button"
                    id="cancelButton"
                    class="btn cancel-btn"
                    onclick="cancelEdit()">

                    Cancel

                </button>

            </div>


        </form>

    </div>


    <!-- FACULTY TABLE -->

    <div class="card">

        <h2>All Faculty</h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Full Name</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Department</th>

                        <th>Designation</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="facultyTableBody">

                    <tr>

                        <td
                            colspan="7"
                            class="loading">

                            Loading faculty...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>


<!-- JAVASCRIPT -->

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script src="js/faculty.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        if (!requireRole("ADMIN")) {
            return;
        }

        console.log(
            "Admin authorized for Faculty Management."
        );

    }
);

</script>


</body>

</html>
