
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty - Upload Question Papers</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 23px;
        }

        button, .back-link {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            background: white;
            color: #1e3a8a;
        }

        main {
            max-width: 750px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .panel {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000012;
        }

        h2 {
            color: #1e3a8a;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        .upload-button {
            margin-top: 24px;
            background: #1e3a8a;
            color: white;
            width: 100%;
        }

        .upload-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .hint {
            color: #64748b;
            font-size: 13px;
            margin-top: 7px;
        }

        @media (max-width: 500px) {
            header {
                padding: 15px;
                flex-wrap: wrap;
            }

            header h1 {
                font-size: 19px;
            }

            .panel {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
<header>
    <h1><i class="fa-solid fa-file-pdf"></i> Question Papers</h1>
    <a class="back-link" href="faculty-dashboard.html">
        <i class="fa-solid fa-arrow-left"></i> Dashboard
    </a>
</header>

<main>
    <section class="panel">
        <h2>Upload Question Paper</h2>
        <p>Choose the subject, examination year, examination type and PDF file.</p>

        <form id="questionPaperForm">
            <label for="subjectId">Subject</label>
            <select id="subjectId" required>
                <option value="">Loading subjects...</option>
            </select>

            <label for="examYear">Examination Year</label>
            <input type="number" id="examYear"
                   min="1900" max="2100"
                   placeholder="e.g. 2025" required>

            <label for="examType">Examination Type</label>
            <select id="examType" required>
                <option value="">Select examination type</option>
                <option value="Semester Examination">Semester Examination</option>
                <option value="Internal Examination">Internal Examination</option>
                <option value="Supplementary Examination">Supplementary Examination</option>
                <option value="Practice Paper">Practice Paper</option>
            </select>

            <label for="file">Question Paper PDF</label>
            <input type="file" id="file" accept=".pdf,application/pdf" required>
            <p class="hint">PDF only. Maximum file size: 10 MB.</p>

            <button class="upload-button" id="uploadButton" type="submit">
                <i class="fa-solid fa-upload"></i> Upload Question Paper
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </section>
</main>

<script src="js/auth.js"></script>
<script src="js/faculty-question-papers.js"></script>
</body>
</html>
