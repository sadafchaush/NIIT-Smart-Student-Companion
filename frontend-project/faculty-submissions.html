<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Faculty - Student Submissions</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #1e3a8a;
            color: white;

            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .back-button {
            background: white;
            color: #1e3a8a;

            border: none;

            padding: 10px 20px;

            border-radius: 5px;

            cursor: pointer;

            font-weight: bold;
        }

        .back-button:hover {
            background: #e5e7eb;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            padding: 30px;
        }

        .card {
            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.1);

            overflow-x: auto;
        }

        h3 {
            color: #1e3a8a;

            margin-bottom: 20px;
        }

        /* =========================
           TABLE
        ========================= */

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 700px;
        }

        th {
            background: #1e3a8a;

            color: white;

            padding: 13px;

            text-align: center;
        }

        td {
            padding: 13px;

            border-bottom: 1px solid #ddd;

            text-align: center;
        }

        tbody tr:hover {
            background: #f1f5f9;
        }

        /* =========================
           FILE BUTTON
        ========================= */

        .file-button {
            display: inline-block;

            background: #2563eb;

            color: white;

            text-decoration: none;

            padding: 7px 14px;

            border-radius: 5px;

            font-size: 14px;
        }

        .file-button:hover {
            background: #1d4ed8;
        }

        /* =========================
           MESSAGES
        ========================= */

        .loading {
            text-align: center;

            padding: 25px;

            color: #666;
        }

        .error {
            text-align: center;

            padding: 25px;

            color: red;
        }

        .no-data {
            text-align: center;

            padding: 25px;

            color: #666;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 15px;

                flex-direction: column;

                gap: 15px;

                text-align: center;
            }

            .container {
                padding: 15px;
            }

            .card {
                padding: 15px;
            }

        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <h2>
        <i class="fa-solid fa-folder-open" aria-hidden="true"></i> Student Submissions
    </h2>

    <button
        class="back-button"
        onclick="goBack()">

        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard

    </button>

</header>

<!-- =========================
     MAIN CONTENT
========================= -->

<div class="container">

    <div class="card">

        <h3>
            <i class="fa-solid fa-list-check" aria-hidden="true"></i> Submitted Assignments
        </h3>

        <table>

            <thead>

                <tr>

                    <th>
                        Student Name
                    </th>

                    <th>
                        Assignment
                    </th>

                    <th>
                        File
                    </th>

                    <th>
                        Submitted Date
                    </th>

                </tr>

            </thead>

            <tbody id="submissionsTableBody">

                <tr>

                    <td
                        colspan="4"
                        class="loading">

                        Loading submissions...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- =========================
     JAVASCRIPT
========================= -->

<script src="js/faculty-submissions.js"></script>

<script>

    function goBack() {
        window.location.href = "faculty-dashboard.html";
    }

</script>

</body>

</html>
