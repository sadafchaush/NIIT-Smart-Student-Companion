
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <!-- Font Awesome icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0ff, #f5f7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .registration-container {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .title {
            text-align: center;
            color: #2563eb;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 20px;
        }

        /* Two-column form layout */
        #registrationForm {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 14px;
            row-gap: 0;
        }

        .form-group {
            min-width: 0;
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            min-width: 0;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        /* Email and Course use the full width */
        #registrationForm .form-group:nth-child(3),
        #registrationForm .form-group:nth-child(4) {
            grid-column: 1 / -1;
        }

        /* Password field and eye button */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #2563eb;
        }

        .toggle-password:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* Register button */
        .register-btn {
            grid-column: 1 / -1;
            width: 100%;
            padding: 12px;
            margin-top: 2px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .message {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
        }

        .success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        .error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        .login-section {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #eee;
            color: #555;
            font-size: 14px;
        }

        .login-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 9px 25px;
            border: 1px solid #2563eb;
            border-radius: 7px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .login-btn:hover {
            background: #2563eb;
            color: white;
        }

        /* Mobile layout */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                align-items: flex-start;
            }

            .registration-container {
                padding: 22px 18px;
            }

            .title {
                font-size: 22px;
            }

            #registrationForm {
                grid-template-columns: 1fr;
            }

            #registrationForm .form-group,
            #registrationForm .register-btn {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>

<body>

    <div class="registration-container">

        <div class="title">
            NIIT Smart Student Companion
        </div>

        <div class="subtitle">
            Student Academic Management System
        </div>

        <h2>Create Account</h2>

        <form id="registrationForm">

            <!-- ROW 1: NAME -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <!-- ROW 1: MOBILE -->
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    autocomplete="tel"
                    required
                >
            </div>

            <!-- ROW 2: EMAIL -->
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <!-- ROW 3: COURSE -->
            <div class="form-group">
                <label for="course">Course</label>

                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="B.Sc Computer Science">
                        B.Sc Computer Science
                    </option>
                    <option value="BCA">BCA</option>
                    <option value="B.Sc IT">B.Sc IT</option>
                    <option value="M.Sc Computer Science">
                        M.Sc Computer Science
                    </option>
                </select>
            </div>

            <!-- ROW 4: PASSWORD -->
            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Exactly 6 characters"
                        minlength="6"
                        maxlength="12"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <i class="fa-solid fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <!-- ROW 4: CONFIRM PASSWORD -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm 6-character password"
                        minlength="6"
                        maxlength="12"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                        aria-label="Show confirm password"
                        aria-pressed="false"
                    >
                        <i class="fa-solid fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <!-- FULL-WIDTH REGISTER BUTTON -->
            <button type="submit" class="register-btn">
                Register
            </button>

        </form>

        <!-- REGISTRATION MESSAGE -->
        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        ></div>

        <!-- LOGIN LINK -->
        <div class="login-section">
            Already have an account?
            <br>

            <a href="login.html" class="login-btn">
                Login
            </a>
        </div>

    </div>

    <!-- Keep your existing JavaScript files -->
    <script src="js/api.js"></script>
    <script src="js/student-registration.js"></script>

</body>
</html>
