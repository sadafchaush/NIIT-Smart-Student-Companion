<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Faculty - Students</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .back-button {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-button:hover {
            background: #e5e7eb;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.1);

            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background: #f1f5f9;
        }

        .message {
            text-align: center;
            padding: 20px;
        }

        .error {
            color: red;
        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <h2>Faculty - Students</h2>

        <button
            class="back-button"
            onclick="goBack()">

            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard

        </button>

    </header>


    <!-- MAIN CONTENT -->

    <div class="container">

        <div class="card">

            <h3>All Students</h3>

            <div
                id="message"
                class="message">

                Loading students...

            </div>


            <table
                id="studentsTable"
                style="display: none;">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Mobile</th>

                        <th>Course</th>

                    </tr>

                </thead>


                <tbody id="studentsBody">

                </tbody>

            </table>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="js/api.js"></script>
    <script src="js/faculty-students.js"></script>


    <script>

        function goBack() {
            window.location.href = "faculty-dashboard.html";
        }

    </script>

</body>

</html>
