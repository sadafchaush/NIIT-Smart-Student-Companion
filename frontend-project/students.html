<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Students</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 18px 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .back-btn {
            background: white;
            color: #1e3a8a;
            border: 1px solid #1e3a8a;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #1e3a8a;
            color: white;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        h2 {
            color: #1e3a8a;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            cursor: pointer;
        }

        .save-btn {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            margin-left: 8px;
            display: none;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="header">

        <h1>Manage Students</h1>

    </div>


    <div class="container">

        <button
            type="button"
            class="back-btn"
            onclick="window.location.href='admin-dashboard.html'">

            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Admin Dashboard

        </button>


        <!-- STUDENT FORM -->

        <div class="card">

            <h2>Add / Edit Student</h2>

            <form id="studentForm">

                <input
                    type="hidden"
                    id="studentId">


                <div class="form-grid">

                    <div class="form-group">

                        <label for="name">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter student name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="mobile">
                            Mobile
                        </label>

                        <input
                            type="text"
                            id="mobile"
                            placeholder="Enter mobile number"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="course">
                            Course
                        </label>

                        <input
                            type="text"
                            id="course"
                            placeholder="Enter course"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password">

                    </div>

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        id="submitButton"
                        class="save-btn">

                        Add Student

                    </button>


                    <button
                        type="button"
                        id="cancelButton"
                        class="cancel-btn"
                        onclick="cancelEdit()">

                        Cancel

                    </button>

                </div>

            </form>

        </div>


        <!-- STUDENT TABLE -->

        <div class="card">

            <h2>Student List</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Mobile</th>

                            <th>Course</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="studentTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="js/auth.js"></script>

    <script src="js/students.js"></script>


</body>

</html>
