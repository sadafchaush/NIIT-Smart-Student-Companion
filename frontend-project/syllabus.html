<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Syllabus</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .back-btn {
            background: white;
            color: #1e3a8a;

            border: none;

            padding: 10px 18px;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;
        }

        .back-btn:hover {
            background: #e5e7eb;
        }

        .container {
            width: 90%;
            max-width: 1100px;

            margin: 30px auto;
        }

        .page-title {
            text-align: center;

            margin-bottom: 25px;
        }

        .page-title h1 {
            color: #1e3a8a;

            margin-bottom: 8px;
        }

        .page-title p {
            color: #666;
        }

        .syllabus-container {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 20px;
        }

        .syllabus-card {
            background: white;

            padding: 22px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.1);
        }

        .syllabus-card h3 {
            color: #1e3a8a;

            margin-bottom: 12px;
        }

        .subject-info {
            color: #555;

            margin-bottom: 8px;
        }

        .description {
            color: #666;

            line-height: 1.5;

            margin: 12px 0;
        }

        .view-btn {
            display: inline-block;

            margin-top: 10px;

            padding: 10px 16px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-weight: bold;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }

        .loading,
        .no-data,
        .error {
            text-align: center;

            padding: 30px;

            background: white;

            border-radius: 10px;

            color: #666;
        }

        .error {
            color: #991b1b;

            background: #fee2e2;
        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>

<header>

    <h2><i class="fa-solid fa-book-open" aria-hidden="true"></i> My Syllabus</h2>

    <button
        class="back-btn"
        onclick="goBack()">

        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard

    </button>

</header>


<div class="container">

    <div class="page-title">

        <h1>Subject Syllabus</h1>

        <p>
            View your subject-wise syllabus
        </p>

    </div>


    <div
        id="syllabusContainer"
        class="syllabus-container">

        <div class="loading">

            Loading syllabus...

        </div>

    </div>

</div>


<script src="js/syllabus.js"></script>

</body>

</html>
