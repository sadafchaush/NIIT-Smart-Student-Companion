<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student - Study Notes</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #333;
            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        header {
            background: #1e3a8a;
            color: white;

            padding: 18px 28px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            font-size: 32px;
        }

        .header-text h1 {
            font-size: 23px;
            margin-bottom: 4px;
        }

        .header-text p {
            font-size: 13px;
            opacity: 0.85;
        }

        .back-button {
            background: white;
            color: #1e3a8a;

            border: none;
            border-radius: 7px;

            padding: 10px 18px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .back-button:hover {
            background: #e5e7eb;
        }

        /* ================= MAIN ================= */

        .container {
            width: 100%;
            max-width: 1200px;

            margin: auto;

            padding: 28px 24px;
        }

        /* ================= CARD ================= */

        .card {
            background: white;

            border-radius: 12px;

            padding: 24px;

            margin-bottom: 24px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.07);
        }

        /* ================= SECTION TITLE ================= */

        .section-title {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 20px;
        }

        .section-icon {
            width: 42px;
            height: 42px;

            border-radius: 9px;

            background: #e8eefc;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
        }

        .section-title h2 {
            color: #1e3a8a;

            font-size: 19px;

            margin-bottom: 4px;
        }

        .section-title p {
            color: #6b7280;

            font-size: 13px;
        }

        /* ================= FILTERS ================= */

        .filters-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: bold;
            color: #374151;
        }

        .filter-group select {
            width: 100%;

            height: 44px;

            padding: 0 12px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            background: white;

            font-size: 14px;

            outline: none;

            cursor: pointer;
        }

        .filter-group select:focus {
            border-color: #1e3a8a;

            box-shadow:
                0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        /* ================= SEARCH ================= */

        .search-container {
            display: flex;

            gap: 10px;

            width: 100%;
        }

        #searchInput {
            flex: 1;

            height: 44px;

            padding: 0 14px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 14px;

            outline: none;
        }

        #searchInput:focus {
            border-color: #1e3a8a;

            box-shadow:
                0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        .refresh-button {
            height: 44px;

            padding: 0 18px;

            background: #1e3a8a;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }

        .refresh-button:hover {
            background: #172554;
        }

        /* ================= NOTES GRID ================= */

        .notes-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));

            gap: 18px;
        }

        /* ================= NOTE CARD ================= */

        .note-card {
            background: #f8fafc;

            border: 1px solid #e5e7eb;

            border-left: 5px solid #1e3a8a;

            border-radius: 9px;

            padding: 18px;

            min-height: 260px;

            display: flex;

            flex-direction: column;

            transition: 0.2s;
        }

        .note-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 5px 14px rgba(0, 0, 0, 0.10);
        }

        .note-card h3 {
            color: #1e3a8a;

            font-size: 18px;

            line-height: 1.4;

            margin-bottom: 12px;
        }

        .note-card p {
            color: #4b5563;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 10px;
        }

        .note-card strong {
            color: #374151;
        }

        /* ================= DOWNLOAD BUTTON ================= */

        .open-button {
            display: inline-block;

            width: fit-content;

            margin-top: auto;

            padding: 9px 14px;

            background: #1e3a8a;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-size: 13px;

            font-weight: bold;
        }

        .open-button:hover {
            background: #172554;
        }

        /* ================= LOADING ================= */

        .loading {
            grid-column: 1 / -1;

            min-height: 180px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color: #6b7280;
        }

        .loader {
            width: 35px;
            height: 35px;

            border: 4px solid #e5e7eb;

            border-top-color: #1e3a8a;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        .loading p {
            margin-top: 12px;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        /* ================= NO NOTES ================= */

        .no-notes {
            grid-column: 1 / -1;

            text-align: center;

            padding: 45px;

            color: #6b7280;

            font-size: 16px;
        }

        /* ================= ERROR ================= */

        .error {
            grid-column: 1 / -1;

            text-align: center;

            padding: 35px;

            color: #dc2626;

            background: #fef2f2;

            border: 1px solid #fecaca;

            border-radius: 8px;

            line-height: 1.6;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            header {
                flex-direction: column;

                text-align: center;

                padding: 16px;
            }

            .header-left {
                justify-content: center;
            }

            .back-button {
                width: 100%;
            }

            .container {
                padding: 18px 14px;
            }

            .card {
                padding: 18px;
            }

            .filters-grid {
                grid-template-columns: 1fr;
            }

            .search-container {
                flex-direction: column;
            }

            #searchInput {
                width: 100%;
            }

            .refresh-button {
                width: 100%;
            }

            .notes-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="header-left">

            <div class="header-icon">
                <i class="fa-solid fa-book-open" aria-hidden="true"></i>
            </div>

            <div class="header-text">

                <h1>Study Notes</h1>

                <p>
                    Access your academic notes
                </p>

            </div>

        </div>

        <button
            type="button"
            class="back-button"
            id="backButton">

            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard

        </button>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- ================= FILTER CARD ================= -->

        <section class="card">

            <div class="section-title">

                <div class="section-icon">
                    <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                </div>

                <div>

                    <h2>Find Study Notes</h2>

                    <p>
                        Select your class, semester and subject
                    </p>

                </div>

            </div>


            <!-- CLASS / SEMESTER / SUBJECT -->

            <div class="filters-grid">


                <!-- CLASS -->

                <div class="filter-group">

                    <label for="classFilter">
                        Select Class
                    </label>

                    <select id="classFilter">

                        <option value="">
                            All Classes
                        </option>

                        <option value="B.Sc Computer Science - 1st Year">
                            B.Sc Computer Science - 1st Year
                        </option>

                        <option value="B.Sc Computer Science - 2nd Year">
                            B.Sc Computer Science - 2nd Year
                        </option>

                        <option value="B.Sc Computer Science - 3rd Year">
                            B.Sc Computer Science - 3rd Year
                        </option>

                    </select>

                </div>


                <!-- SEMESTER -->

                <div class="filter-group">

                    <label for="semesterFilter">
                        Select Semester
                    </label>

                    <select id="semesterFilter">

                        <option value="">
                            All Semesters
                        </option>

                        <option value="1">
                            Semester 1
                        </option>

                        <option value="2">
                            Semester 2
                        </option>

                        <option value="3">
                            Semester 3
                        </option>

                        <option value="4">
                            Semester 4
                        </option>

                        <option value="5">
                            Semester 5
                        </option>

                        <option value="6">
                            Semester 6
                        </option>

                    </select>

                </div>


                <!-- SUBJECT -->

                <div class="filter-group">

                    <label for="subjectFilter">
                        Select Subject
                    </label>

                    <select id="subjectFilter">

                        <option value="">
                            All Subjects
                        </option>

                    </select>

                </div>

            </div>


            <!-- SEARCH -->

            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search notes by title, description or subject..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="refresh-button"
                    id="refreshButton">

                    <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i> Refresh

                </button>

            </div>

        </section>


        <!-- ================= NOTES ================= -->

        <section class="card">

            <div class="section-title">

                <div class="section-icon">
                    <i class="fa-solid fa-book-open" aria-hidden="true"></i>
                </div>

                <div>

                    <h2>Available Notes</h2>

                    <p>
                        Notes uploaded by faculty
                    </p>

                </div>

            </div>


            <div
                id="notesContainer"
                class="notes-grid">

                <div class="loading">

                    <div class="loader"></div>

                    <p>
                        Loading notes...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- STUDENT NOTES JS -->

    <script src="js/student-notes.js"></script>

</body>

</html>
