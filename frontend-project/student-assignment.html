<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Assignments</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#f4f6f9;
        }

        header{
            background:#1e3a8a;
            color:white;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h2{
            margin:0;
        }

        .back-btn{
            background:white;
            color:#1e3a8a;
            border:none;
            padding:10px 18px;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
        }

        .back-btn:hover{
            background:#e5e7eb;
        }

        .container{
            padding:30px;
        }

        .page-header{
            text-align:center;
            margin-bottom:25px;
        }

        .page-header h1{
            color:#1e3a8a;
            margin-bottom:10px;
        }

        .page-header p{
            color:#666;
        }

        .assignment-container{
            display:grid;
            gap:20px;
        }

        .assignment-card{
            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        .assignment-card h3{
            color:#1e3a8a;
            margin-bottom:10px;
        }

        .assignment-card p{
            margin:8px 0;
        }

        .submit-btn{
            margin-top:15px;
            background:#1e3a8a;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:6px;
            cursor:pointer;
        }

        .submit-btn:hover{
            background:#2563eb;
        }

        .message{
            display:none;
            padding:12px;
            margin-bottom:20px;
            border-radius:6px;
            text-align:center;
        }

        .success{
            display:block;
            background:#d1fae5;
            color:#065f46;
        }

        .error{
            display:block;
            background:#fee2e2;
            color:#991b1b;
        }

        .loading{
            text-align:center;
            color:#666;
        }

        /* Modal */

        .modal{
            display:none;
            position:fixed;
            left:0;
            top:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,.5);
        }

        .modal-content{
            background:white;
            width:420px;
            margin:8% auto;
            padding:25px;
            border-radius:10px;
            position:relative;
        }

        .close{
            position:absolute;
            right:15px;
            top:10px;
            font-size:26px;
            cursor:pointer;
        }

        .modal input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:20px;
        }

        .submit-work-btn{
            width:100%;
            background:#1e3a8a;
            color:white;
            border:none;
            padding:12px;
            border-radius:6px;
            cursor:pointer;
        }

        .submit-work-btn:hover{
            background:#2563eb;
        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>

<header>

    <h2><i class="fa-solid fa-book-open" aria-hidden="true"></i> My Assignments</h2>

    <button
        class="back-btn"
        onclick="goBack()">

        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard

    </button>

</header>


<div class="container">

    <div class="page-header">

        <h1>Student Assignments</h1>

        <p>View your assignments and submit your work.</p>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <div
        id="assignmentContainer"
        class="assignment-container">

        <p class="loading">
            Loading assignments...
        </p>

    </div>

</div>


<div
    id="submitModal"
    class="modal">

    <div class="modal-content">

        <span
            class="close"
            onclick="closeModal()">

            &times;

        </span>

        <h2>Submit Assignment</h2>

        <p id="selectedAssignment"></p>

        <input
            type="hidden"
            id="assignmentId">

        <input
            type="hidden"
            id="studentId">

        <label>

            Assignment File URL

        </label>

        <input
            type="text"
            id="fileUrl"
            placeholder="Enter Google Drive or GitHub link">

        <button
            class="submit-work-btn"
            onclick="submitAssignment()">

            Submit Assignment

        </button>

    </div>

</div>


<script src="js/student-assignment.js"></script>

</body>

</html>
