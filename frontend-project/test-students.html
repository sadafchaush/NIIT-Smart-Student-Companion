<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

<title>Student API Test</title>

</head>

<body>


<h1>Student API Test</h1>

<p id="status">Loading...</p>

<table border="1" id="studentTable">

    <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Course</th>
        </tr>

    </thead>

    <tbody id="studentTableBody">

    </tbody>

</table>


<script src="js/api.js"></script>
<script>

    const API_URL =
        `${window.NIIT_API_BASE_URL}/students`;


    async function loadStudents() {

        try {

            console.log(
                "Calling API:",
                API_URL
            );


            const response =
                await fetch(API_URL);


            console.log(
                "Response status:",
                response.status
            );


            if (!response.ok) {

                throw new Error(
                    "HTTP Error: " +
                    response.status
                );

            }


            const students =
                await response.json();


            console.log(
                "API DATA:",
                students
            );


            const tableBody =
                document.getElementById(
                    "studentTableBody"
                );


            tableBody.replaceChildren();


            students.forEach(
                function(student) {

                    console.log(
                        "Student:",
                        student
                    );


                    const row =
                        document.createElement(
                            "tr"
                        );


                    [
                        student.id,
                        student.name,
                        student.email,
                        student.mobile,
                        student.course
                    ].forEach(function(value) {
                        const cell = document.createElement("td");
                        cell.textContent = value == null ? "" : String(value);
                        row.appendChild(cell);
                    });


                    tableBody.appendChild(
                        row
                    );

                }
            );


            document.getElementById(
                "status"
            ).textContent =
                "Students loaded successfully!";


        } catch (error) {

            console.error(
                "ERROR:",
                error
            );


            document.getElementById(
                "status"
            ).textContent =
                "Error: " +
                error.message;

        }

    }


    loadStudents();

</script>

</body>

</html>
