<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Faculty - Announcements</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .back-button {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-button:hover {
            background: #e5e7eb;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h3 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 14px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .post-button {
            background: #1e3a8a;
            color: white;

            border: none;
            padding: 12px 25px;

            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .post-button:hover {
            background: #172554;
        }

        .announcement-card {
            background: #f8fafc;
            padding: 20px;
            margin-bottom: 15px;

            border-left: 5px solid #1e3a8a;
            border-radius: 7px;
        }

        .announcement-card h4 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .announcement-card p {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .date {
            color: #777;
            font-size: 13px;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>

<header>

    <h2><i class="fa-solid fa-bullhorn" aria-hidden="true"></i> Faculty - Announcements</h2>

    <button
        class="back-button"
        onclick="goBack()">

        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard

    </button>

</header>


<div class="container">

    <!-- CREATE ANNOUNCEMENT -->

    <div class="card">

        <h3><i class="fa-solid fa-circle-plus" aria-hidden="true"></i> Create Announcement</h3>

        <form id="announcementForm">

            <div class="form-group">

                <label for="title">
                    Announcement Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter announcement title"
                    required>

            </div>


            <div class="form-group">

                <label for="messageText">
                    Message
                </label>

                <textarea
                    id="messageText"
                    placeholder="Enter announcement message"
                    required></textarea>

            </div>

            
<div class="form-group">
    <label for="subjectId">Subject</label>
    <select id="subjectId" required
        style="width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;">
        <option value="">Loading subjects...</option>
    </select>
</div>


            <button
                type="submit"
                class="post-button">

                Post Announcement

            </button>

            <div
                id="message"
                class="message">
            </div>

        </form>

    </div>


    <!-- ALL ANNOUNCEMENTS -->

    <div class="card">

        <h3><i class="fa-solid fa-list-check" aria-hidden="true"></i> All Announcements</h3>

        <div id="announcementsContainer">

            Loading announcements...

        </div>

    </div>

</div>


<script src="js/faculty-announcements.js"></script>

</body>

</html>
