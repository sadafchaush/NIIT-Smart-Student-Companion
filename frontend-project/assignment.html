<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/icon-512.png">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assignments</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 18px 30px;
        }

        header h2 {
            margin: 0;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .back-button {
            display: inline-block;
            background: white;
            color: #1e3a8a;
            border: 1px solid #1e3a8a;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .back-button:hover {
            background: #1e3a8a;
            color: white;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        .card h3 {
            margin-top: 0;
            color: #1e3a8a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .error {
            color: #dc2626;
            text-align: center;
        }

    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>


    <header>

        <h2>
            <i class="fa-solid fa-file-pen" aria-hidden="true"></i> Assignments
        </h2>

    </header>


    <div class="container">


        <button
            class="back-button"
            onclick="goBack()"
        >
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard
        </button>


        <div class="card">

            <h3>
                Available Assignments
            </h3>


            <table>

                <thead>

                    <tr>

                        <th>
                            Title
                        </th>

                        <th>
                            Description
                        </th>

                        <th>
                            Deadline
                        </th>

                        <th>
                            Subject ID
                        </th>

                        <th>
                            Faculty ID
                        </th>

                    </tr>

                </thead>


                <tbody id="assignmentsTableBody">

                    <tr>

                        <td colspan="5">
                            Loading assignments...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script src="js/assignment.js"></script>

</body>

</html>
